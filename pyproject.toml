[project]
name = "sensibo-cli"
version = "0.6.0"
description = "Agent and CLI for Sensibo smart-AC control at home: discover devices, collect every sensor reading locally (temperature, humidity, air quality), and set up automated conditions that drive the AC (mode, target, fan, schedules, thresholds). Unofficial community tool; Sensibo is a trademark of Sensibo Ltd."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
# The MCP surface (`sensibo mcp serve`) is the ONLY thing allowed to need
# this. The core CLI's `dependencies = []` above stays empty, deliberately
# (docs/architecture.md, "Zero runtime dependencies, deliberately") — this
# extra gates only its own surface. See sensibo/mcp_server/__init__.py.
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/agentculture/sensibo-cli"
Issues = "https://github.com/agentculture/sensibo-cli/issues"

[project.scripts]
sensibo = "sensibo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sensibo"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    # dev-only so the test suite can exercise `sensibo mcp serve`
    # (sensibo/mcp_server/) without the core CLI depending on it — see the
    # `mcp` extra above and sensibo/mcp_server/__init__.py.
    "mcp>=1.0",
]

[tool.coverage.run]
source = ["sensibo"]
omit = ["sensibo/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=sensibo (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["sensibo"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
